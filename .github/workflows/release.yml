name: Release (Win + Linux + macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '5.15.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -G "NMake Makefiles" -B build `
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage/plugins
          cp build/EarShield_win64.dll stage/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: stage/plugins/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake pkg-config zip \
              qtbase5-dev qttools5-dev qttools5-dev-tools \
              libqt5network5 libqt5gui5 libqt5widgets5 libqt5core5a

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Stage artifact
        run: |
          mkdir -p stage/plugins
          cp build/libearshield_linux_amd64.so stage/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: stage/plugins/
          if-no-files-found: error

  # ---------------- macOS x86_64 ----------------
  # Self-hosted runner on a personal Apple Silicon Mac. TS3 on macOS is
  # x86_64-only, so we link against x86_64 Qt5 from an Intel Homebrew tree
  # at /usr/local invoked through Rosetta 2.
  #
  # ONE-TIME SETUP REQUIRED ON THE MAC (cannot run from CI - needs sudo):
  #   1. sudo softwareupdate --install-rosetta --agree-to-license
  #   2. xcode-select --install                     # if not already
  #   3. arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  #   4. arch -x86_64 /usr/local/bin/brew install qt@5
  build-macos:
    runs-on: self-hosted
    env:
      INTEL_BREW: /usr/local/bin/brew
    steps:
      - uses: actions/checkout@v4

      - name: Verify Rosetta + Intel Homebrew prerequisites
        run: |
          if ! arch -x86_64 /usr/bin/uname -m >/dev/null 2>&1; then
              cat <<'EOF' >&2
          ERROR: Rosetta 2 is not installed on this runner.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              sudo softwareupdate --install-rosetta --agree-to-license
          EOF
              exit 1
          fi
          arch -x86_64 /usr/bin/uname -m
          if [ ! -x "$INTEL_BREW" ]; then
              cat <<'EOF' >&2
          ERROR: Intel Homebrew is not installed at /usr/local.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              arch -x86_64 /usr/local/bin/brew install qt@5
          EOF
              exit 1
          fi
          arch -x86_64 "$INTEL_BREW" --version

      - name: Update Qt5 via Intel Homebrew (no sudo)
        run: |
          arch -x86_64 "$INTEL_BREW" update || true
          arch -x86_64 "$INTEL_BREW" install qt@5 2>&1 | tail -20 || true
          arch -x86_64 "$INTEL_BREW" upgrade qt@5 2>&1 | tail -20 || true
          echo "/usr/local/opt/qt@5/bin" >> "$GITHUB_PATH"

      - name: Sanity-check arch of dependencies
        run: |
          file /usr/local/opt/qt@5/lib/QtCore.framework/QtCore | tee /tmp/arch.log
          if grep -E "arm64" /tmp/arch.log; then
              echo "Dependencies are arm64 - link will fail. Aborting." >&2
              exit 1
          fi

      - name: Configure (x86_64)
        run: |
          cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Stage macOS artifact (flat dylibs, recursive deps)
        run: |
          set -e
          mkdir -p stage/plugins
          DYLIB="$(find build -name 'libearshield_mac.dylib' | head -1)"
          [ -z "$DYLIB" ] && { echo "dylib not found"; ls -la build; exit 1; }
          cp "$DYLIB" stage/plugins/libearshield_mac.dylib
          chmod u+w stage/plugins/libearshield_mac.dylib

          QT_PREFIX="$(/usr/local/bin/brew --prefix qt@5)"
          QT_FWS="Core Gui Network Widgets"

          # TS3's macOS .ts3_plugin installer flattens any subdir under
          # plugins/, so framework directories are dropped entirely.
          # Workaround: extract each Qt framework's binary as a plain
          # dylib at plugins/<libQt5X.dylib>. Same pattern soundboard
          # uses for FFmpeg. TS3 will try to load each as a plugin and
          # log a harmless "Required plugin function not found" warning.
          for q in $QT_FWS; do
              SRC="${QT_PREFIX}/lib/Qt${q}.framework/Versions/5/Qt${q}"
              [ ! -f "$SRC" ] && { echo "missing Qt$q binary"; exit 1; }
              DST="stage/plugins/libQt5${q}.dylib"
              cp "$SRC" "$DST"
              chmod u+w "$DST"
              install_name_tool -id "@rpath/libQt5${q}.dylib" "$DST"
          done

          # Plugin dylib rpath: @loader_path so it finds bundled dylibs
          # next to itself in plugins/.
          install_name_tool -add_rpath "@loader_path" stage/plugins/libearshield_mac.dylib 2>/dev/null || true

          # Recursive dep bundler. Walks every bundled binary, finds each
          # /usr/local/* dependency, rewrites the reference to @rpath:
          #   - Qt framework deps  -> @rpath/libQt5<X>.dylib
          #   - plain dylibs       -> @rpath/<basename>; copy flat into
          #                          plugins/ and id-stamp them too.
          # Iterates until a full pass produces zero changes or 8 rounds.
          rewrite_pass() {
              local CHANGED=0
              local TARGETS=()
              for f in stage/plugins/libearshield_mac.dylib stage/plugins/lib*.dylib; do
                  [ -f "$f" ] && TARGETS+=("$f")
              done
              local BIN
              for BIN in "${TARGETS[@]}"; do
                  [ -f "$BIN" ] || continue
                  chmod u+w "$BIN"
                  while IFS= read -r DEP; do
                      [ -z "$DEP" ] && continue
                      local BASE NEW TARGET
                      if [[ "$DEP" == *.framework/Versions/* ]]; then
                          BASE="$(basename "$DEP")"
                          NEW="@rpath/libQt5${BASE}.dylib"
                      else
                          BASE="$(basename "$DEP")"
                          NEW="@rpath/${BASE}"
                          TARGET="stage/plugins/${BASE}"
                          if [ ! -f "$TARGET" ]; then
                              cp "$DEP" "$TARGET"
                              chmod u+w "$TARGET"
                              install_name_tool -id "@rpath/${BASE}" "$TARGET" 2>/dev/null || true
                              echo "+bundled: $BASE (from $DEP)"
                              CHANGED=1
                          fi
                      fi
                      if install_name_tool -change "$DEP" "$NEW" "$BIN" 2>/dev/null; then
                          CHANGED=1
                          echo "rewrite($BIN): $DEP -> $NEW"
                      fi
                  done < <(otool -L "$BIN" | awk '/^\t\/usr\/local\// {print $1}' | sort -u)
              done
              return $CHANGED
          }

          for round in 1 2 3 4 5 6 7 8; do
              echo "===== rewrite round $round ====="
              rewrite_pass || true
              REMAIN=$(find stage/plugins -maxdepth 1 -name '*.dylib' -exec otool -L {} \; 2>/dev/null | grep -c '^[[:space:]]*/usr/local/' || true)
              echo "remaining /usr/local/ refs: $REMAIN"
              [ "$REMAIN" = "0" ] && break
          done

          # Strip symbol tables
          for BIN in stage/plugins/*.dylib; do
              [ -f "$BIN" ] && strip -x "$BIN" 2>/dev/null || true
          done

          BAD=$(find stage/plugins -maxdepth 1 -name '*.dylib' -exec otool -L {} \; 2>/dev/null | grep '/usr/local/' || true)
          if [ -n "$BAD" ]; then
              echo "ERROR: stage still has /usr/local/* references:"
              echo "$BAD"
              exit 1
          fi

          # Ad-hoc codesign every dylib so Gatekeeper does not block dlopen
          for BIN in stage/plugins/*.dylib; do
              codesign --force -s - "$BIN" 2>/dev/null || true
          done

          echo "--- final flat layout ---"
          ls -la stage/plugins/
          du -sh stage/plugins
          echo "--- plugin dylib otool ---"
          otool -L stage/plugins/libearshield_mac.dylib

      - name: Build macOS-only .ts3_plugin (input for the .app installer)
        run: |
          PKG_ROOT="$(mktemp -d)"
          mkdir -p "$PKG_ROOT/plugins"
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
              VERSION="0.0.0-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          sed "s/^Version = .*/Version = ${VERSION}/" package.ini > "$PKG_ROOT/package.ini"
          cp -R stage/plugins/. "$PKG_ROOT/plugins/"
          MAC_PKG="$(pwd)/EarShield_${VERSION}_macos_x86_64.ts3_plugin"
          rm -f "$MAC_PKG"
          (cd "$PKG_ROOT" && zip -r "$MAC_PKG" . -x "**/.DS_Store")
          ls -la "$MAC_PKG"
          echo "MAC_PKG=$MAC_PKG" >> "$GITHUB_ENV"

      - name: Build Install EarShield.app via osacompile
        run: |
          APP_NAME="Install EarShield"
          APP_BUILD_DIR="$(pwd)/macinstaller"
          rm -rf "$APP_BUILD_DIR"
          mkdir -p "$APP_BUILD_DIR"
          cd "$APP_BUILD_DIR"

          cat > installer.applescript <<'AS'
          on run
              try
                  set appPath to POSIX path of (path to me)
                  set scriptPath to appPath & "Contents/Resources/install_embedded_macos.sh"
                  set pluginPath to appPath & "Contents/Resources/EarShield.ts3_plugin"
                  display dialog "Install EarShield for TeamSpeak 3?" buttons {"Cancel", "Install"} default button "Install" with icon note with title "EarShield Installer"
                  if button returned of result is not "Install" then return
                  set installedTo to do shell script "/bin/bash " & quoted form of scriptPath & " " & quoted form of pluginPath
                  display dialog "Installation complete." & return & return & "Plugin folder: " & installedTo & return & return & "Reopen TeamSpeak 3 and enable EarShield from Tools -> Options -> Addons if it is not already active." buttons {"OK"} default button "OK" with icon note with title "EarShield Installer"
              on error errMsg number errNum
                  if errNum is -128 then return
                  display dialog "Installation failed:" & return & return & errMsg buttons {"OK"} default button "OK" with icon stop with title "EarShield Installer"
              end try
          end run
          AS

          osacompile -o "${APP_NAME}.app" installer.applescript

          cp "$MAC_PKG"                              "${APP_NAME}.app/Contents/Resources/EarShield.ts3_plugin"
          cp ../dist/install_embedded_macos.sh       "${APP_NAME}.app/Contents/Resources/"
          chmod +x                                    "${APP_NAME}.app/Contents/Resources/install_embedded_macos.sh"

          codesign --force --deep -s - "${APP_NAME}.app"
          codesign --verify --deep --verbose=2 "${APP_NAME}.app" || true

          zip -r ../Install_EarShield_macOS.zip "${APP_NAME}.app"
          ls -la ../Install_EarShield_macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: Install_EarShield_macOS.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: stage/plugins/
          if-no-files-found: error

  package-and-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: windows-x64, path: combined/plugins/ }
      - uses: actions/download-artifact@v4
        with: { name: linux-x64,   path: combined/plugins/ }
      - uses: actions/download-artifact@v4
        with: { name: macos-x64,   path: combined/plugins/ }
      - uses: actions/download-artifact@v4
        with: { name: macos-installer, path: ./ }

      - name: Resolve version + write package.ini
        id: ver
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
              VERSION="0.0.0-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          sed "s/^Version = .*/Version = ${VERSION}/" package.ini > combined/package.ini

      - name: List staged files
        run: ls -la combined/ combined/plugins/

      - name: Build versioned + stable .ts3_plugin
        run: |
          cd combined
          zip -r "../EarShield_${{ steps.ver.outputs.VERSION }}.ts3_plugin" . -x "**/.DS_Store"
          cp "../EarShield_${{ steps.ver.outputs.VERSION }}.ts3_plugin" "../EarShield.ts3_plugin"

      - name: Read release notes
        id: notes
        run: |
          if [ -f release-notes.txt ]; then cp release-notes.txt /tmp/notes.txt
          else echo "Release ${{ steps.ver.outputs.VERSION }}" > /tmp/notes.txt
          fi
          echo "NOTES_PATH=/tmp/notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "EarShield ${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          files: |
            EarShield_*.ts3_plugin
            EarShield.ts3_plugin
            Install_EarShield_macOS.zip
            dist/uninstall_earshield.bat
            dist/uninstall_earshield.sh
            dist/uninstall_earshield_macos.sh
          fail_on_unmatched_files: false
