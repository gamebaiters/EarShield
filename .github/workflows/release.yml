name: Release (Win + Linux + macOS)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  QT_VERSION: '5.15.2'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -G "NMake Makefiles" -B build `
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        shell: pwsh
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p stage/plugins
          cp build/EarShield_win64.dll stage/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: stage/plugins/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake pkg-config zip \
              qtbase5-dev qttools5-dev qttools5-dev-tools \
              libqt5network5 libqt5gui5 libqt5widgets5 libqt5core5a

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Stage artifact
        run: |
          mkdir -p stage/plugins
          cp build/libearshield_linux_amd64.so stage/plugins/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: stage/plugins/
          if-no-files-found: error

  # ---------------- macOS x86_64 ----------------
  # Self-hosted runner on a personal Apple Silicon Mac. TS3 on macOS is
  # x86_64-only, so we link against x86_64 Qt5 from an Intel Homebrew tree
  # at /usr/local invoked through Rosetta 2.
  #
  # ONE-TIME SETUP REQUIRED ON THE MAC (cannot run from CI - needs sudo):
  #   1. sudo softwareupdate --install-rosetta --agree-to-license
  #   2. xcode-select --install                     # if not already
  #   3. arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  #   4. arch -x86_64 /usr/local/bin/brew install qt@5
  build-macos:
    runs-on: self-hosted
    env:
      INTEL_BREW: /usr/local/bin/brew
    steps:
      - uses: actions/checkout@v4

      - name: Verify Rosetta + Intel Homebrew prerequisites
        run: |
          if ! arch -x86_64 /usr/bin/uname -m >/dev/null 2>&1; then
              cat <<'EOF' >&2
          ERROR: Rosetta 2 is not installed on this runner.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              sudo softwareupdate --install-rosetta --agree-to-license
          EOF
              exit 1
          fi
          arch -x86_64 /usr/bin/uname -m
          if [ ! -x "$INTEL_BREW" ]; then
              cat <<'EOF' >&2
          ERROR: Intel Homebrew is not installed at /usr/local.
          Run ONCE on the Mac (interactive sudo, can't run from CI):
              arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
              arch -x86_64 /usr/local/bin/brew install qt@5
          EOF
              exit 1
          fi
          arch -x86_64 "$INTEL_BREW" --version

      - name: Update Qt5 via Intel Homebrew (no sudo)
        run: |
          arch -x86_64 "$INTEL_BREW" update || true
          arch -x86_64 "$INTEL_BREW" install qt@5 2>&1 | tail -20 || true
          arch -x86_64 "$INTEL_BREW" upgrade qt@5 2>&1 | tail -20 || true
          echo "/usr/local/opt/qt@5/bin" >> "$GITHUB_PATH"

      - name: Sanity-check arch of dependencies
        run: |
          file /usr/local/opt/qt@5/lib/QtCore.framework/QtCore | tee /tmp/arch.log
          if grep -E "arm64" /tmp/arch.log; then
              echo "Dependencies are arm64 - link will fail. Aborting." >&2
              exit 1
          fi

      - name: Configure (x86_64)
        run: |
          cmake -B build \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DCMAKE_OSX_ARCHITECTURES=x86_64 \
              -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Rewrite plugin dylib install names + add rpath
        run: |
          DYLIB="$(find build -name 'libearshield_mac.dylib' | head -1)"
          if [ -z "$DYLIB" ]; then
              echo "dylib not found"; ls -la build; exit 1
          fi
          QT_PREFIX="$(/usr/local/bin/brew --prefix qt@5)"
          echo "Brew Qt prefix: $QT_PREFIX"
          echo "--- plugin dylib BEFORE ---"
          otool -L "$DYLIB"
          for q in Core Widgets Gui Network; do
              install_name_tool -change \
                  "${QT_PREFIX}/lib/Qt${q}.framework/Versions/5/Qt${q}" \
                  "@rpath/Qt${q}.framework/Versions/5/Qt${q}" "$DYLIB" || true
              install_name_tool -change \
                  "/usr/local/opt/qt@5/lib/Qt${q}.framework/Versions/5/Qt${q}" \
                  "@rpath/Qt${q}.framework/Versions/5/Qt${q}" "$DYLIB" || true
          done
          # Plugin loads its bundled Qt frameworks from plugins/Frameworks/
          # next to the dylib. TS3 itself does not ship the Qt frameworks
          # the plugin depends on, so we ship our own copies.
          install_name_tool -add_rpath "@loader_path/Frameworks" "$DYLIB" 2>/dev/null || true
          echo "--- plugin dylib AFTER ---"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -E '/usr/local/.*Qt[A-Za-z]+\.framework' >/dev/null; then
              echo "ERROR: dylib still has hardcoded Qt absolute paths"
              exit 1
          fi

      - name: Stage macOS artifact + bundle Qt frameworks
        run: |
          set -e
          mkdir -p stage/plugins/Frameworks
          DYLIB="$(find build -name 'libearshield_mac.dylib' | head -1)"
          cp "$DYLIB" stage/plugins/libearshield_mac.dylib

          QT_PREFIX="$(/usr/local/bin/brew --prefix qt@5)"
          QT_FWS="Core Gui Network Widgets"

          # Copy each Qt framework into stage/plugins/Frameworks, stripped
          # of headers / debug / prl files to keep the package small.
          for q in $QT_FWS; do
              FW="Qt${q}.framework"
              SRC="${QT_PREFIX}/lib/${FW}"
              if [ ! -d "$SRC" ]; then echo "missing $SRC"; exit 1; fi
              cp -R "$SRC" "stage/plugins/Frameworks/"
              DST="stage/plugins/Frameworks/${FW}"
              rm -rf "$DST/Headers" "$DST/Versions/5/Headers" "$DST/Versions/Current/Headers"
              find "$DST" -name "*_debug*"      -delete 2>/dev/null || true
              find "$DST" -name "*.prl"         -delete 2>/dev/null || true
              find "$DST" -name "Headers"  -type l -delete 2>/dev/null || true
          done

          # Rewrite each bundled framework's LC_ID_DYLIB to @rpath, plus
          # rewrite its inter-Qt dependencies so dyld resolves them via
          # @rpath = @loader_path/Frameworks (set on the plugin dylib).
          for q in $QT_FWS; do
              BIN="stage/plugins/Frameworks/Qt${q}.framework/Versions/5/Qt${q}"
              [ ! -f "$BIN" ] && { echo "missing bin $BIN"; exit 1; }
              chmod u+w "$BIN"
              install_name_tool -id "@rpath/Qt${q}.framework/Versions/5/Qt${q}" "$BIN"
              for q2 in Core Gui Network Widgets DBus PrintSupport; do
                  install_name_tool -change \
                      "${QT_PREFIX}/lib/Qt${q2}.framework/Versions/5/Qt${q2}" \
                      "@rpath/Qt${q2}.framework/Versions/5/Qt${q2}" "$BIN" 2>/dev/null || true
                  install_name_tool -change \
                      "/usr/local/opt/qt@5/lib/Qt${q2}.framework/Versions/5/Qt${q2}" \
                      "@rpath/Qt${q2}.framework/Versions/5/Qt${q2}" "$BIN" 2>/dev/null || true
              done
              # Strip symbol table to shrink dylib (frameworks ship full debug)
              strip -x "$BIN" 2>/dev/null || true
              echo "--- $BIN ---"
              otool -L "$BIN" | head -8
          done

          # Hard-fail if any bundled framework still references brew paths.
          if find stage/plugins/Frameworks -type f -name 'Qt*' | xargs -I{} otool -L "{}" | grep -E '/usr/local/.*Qt[A-Za-z]+\.framework' ; then
              echo "ERROR: bundled framework still has /usr/local Qt path"
              exit 1
          fi

          # Final layout
          find stage/plugins -maxdepth 3 -print
          du -sh stage/plugins

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: stage/plugins/
          if-no-files-found: error

  package-and-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: windows-x64, path: combined/plugins/ }
      - uses: actions/download-artifact@v4
        with: { name: linux-x64,   path: combined/plugins/ }
      - uses: actions/download-artifact@v4
        with: { name: macos-x64,   path: combined/plugins/ }

      - name: Resolve version + write package.ini
        id: ver
        run: |
          TAG="${GITHUB_REF##refs/tags/}"
          VERSION="${TAG#v}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
              VERSION="0.0.0-$(date +%Y%m%d%H%M)-$(echo $GITHUB_SHA | cut -c1-7)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          sed "s/^Version = .*/Version = ${VERSION}/" package.ini > combined/package.ini

      - name: List staged files
        run: ls -la combined/ combined/plugins/

      - name: Build versioned + stable .ts3_plugin
        run: |
          cd combined
          zip -r "../EarShield_${{ steps.ver.outputs.VERSION }}.ts3_plugin" . -x "**/.DS_Store"
          cp "../EarShield_${{ steps.ver.outputs.VERSION }}.ts3_plugin" "../EarShield.ts3_plugin"

      - name: Read release notes
        id: notes
        run: |
          if [ -f release-notes.txt ]; then cp release-notes.txt /tmp/notes.txt
          else echo "Release ${{ steps.ver.outputs.VERSION }}" > /tmp/notes.txt
          fi
          echo "NOTES_PATH=/tmp/notes.txt" >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "EarShield ${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.NOTES_PATH }}
          files: |
            EarShield_*.ts3_plugin
            EarShield.ts3_plugin
            dist/uninstall_earshield.bat
            dist/uninstall_earshield.sh
            dist/uninstall_earshield_macos.sh
          fail_on_unmatched_files: false
